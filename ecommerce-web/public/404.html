<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const path = window.location.pathname;
    const repo = "/Ecommerce-Website";
    
    if (path.startsWith(repo)) {
      const route = path.substring(repo.length);
      window.location.replace(
        repo + "/?redirect=" + encodeURIComponent(route + window.location.search + window.location.hash)
      );
    }
  </script>
</head>
<body>
</body>
</html>
