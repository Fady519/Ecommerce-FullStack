<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="luxeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#luxeGrad)" stroke-width="12" stroke-opacity="0.5" />
  
  <!-- Shopping Bag Body -->
  <path d="M128 176 C128 160 144 144 164 144 L348 144 C368 144 384 160 384 176 L416 400 C416 424 396 448 368 448 L144 448 C116 448 96 424 96 400 Z" 
        fill="url(#luxeGrad)" />
  
  <!-- Bag Handle -->
  <path d="M192 176 V136 C192 100 220 72 256 72 C292 72 320 100 320 136 V176" 
        stroke="#ffffff" stroke-width="28" stroke-linecap="round" fill="none" />
        
  <!-- Sparkle / Diamond inside Bag -->
  <polygon points="256,220 274,270 324,288 274,306 256,356 238,306 188,288 238,270" fill="#ffffff" />
</svg>
